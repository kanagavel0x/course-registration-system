<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enrolled Students - Course Registration System</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --focus-ring: #93c5fd;
      --badge-bg: #f1f5f9;
      --badge-text: #475569;
      --course-pill-bg: #e0e7ff;
      --course-pill-text: #3730a3;
      --success-bg: #ecfdf5;
      --success-text: #065f46;
      --success-border: #a7f3d0;
      --error-bg: #fef2f2;
      --error-text: #991b1b;
      --error-border: #fecaca;
      --radius: 10px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -2px rgba(0, 0, 0, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1.5rem;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
    }

    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .nav-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.95rem;
    }

    .nav-link:hover {
      text-decoration: underline;
    }

    .header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .header-title h1 {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 0.35rem;
    }

    .header-title p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Controls: Search, Filter, Refresh */
    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      background: var(--card-bg);
      padding: 1rem 1.25rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      margin-bottom: 1.75rem;
    }

    .filters-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
      flex: 1;
      min-width: 300px;
    }

    .search-box {
      flex: 1;
      min-width: 200px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      min-height: 42px;
      padding: 0.55rem 1rem 0.55rem 2.25rem;
      font-size: 0.95rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    .search-icon {
      position: absolute;
      left: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .filter-select {
      min-height: 42px;
      padding: 0.55rem 1rem;
      font-size: 0.95rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      outline: none;
      cursor: pointer;
    }

    .filter-select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    .stats-and-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .stats-badge {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .stats-badge strong {
      color: var(--text);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0.6rem 1.25rem;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s ease;
      border: 1px solid transparent;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-outline {
      background-color: #fff;
      border-color: var(--border);
      color: var(--text);
    }

    .btn-outline:hover {
      background-color: #f1f5f9;
    }

    /* Alert */
    .alert {
      padding: 0.85rem 1rem;
      border-radius: 6px;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      border: 1px solid transparent;
    }

    .alert-error {
      background-color: var(--error-bg);
      color: var(--error-text);
      border-color: var(--error-border);
    }

    .hidden {
      display: none !important;
    }

    /* Table Container */
    .table-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.95rem;
    }

    thead {
      background-color: #f8fafc;
      border-bottom: 1px solid var(--border);
    }

    th {
      padding: 1rem 1.25rem;
      font-weight: 600;
      color: var(--text-muted);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    td {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tbody tr:hover {
      background-color: #f8fafc;
    }

    /* Badges & Links */
    .id-badge {
      display: inline-block;
      padding: 0.2rem 0.55rem;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 600;
      background-color: var(--badge-bg);
      color: var(--badge-text);
    }

    .font-semibold {
      font-weight: 600;
      color: var(--text);
    }

    .email-link {
      color: var(--primary);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }

    .email-link:hover {
      text-decoration: underline;
    }

    .course-pill {
      display: inline-block;
      padding: 0.3rem 0.75rem;
      border-radius: 9999px;
      background-color: var(--course-pill-bg);
      color: var(--course-pill-text);
      font-size: 0.85rem;
      font-weight: 600;
    }

    .text-center { text-align: center; }
    .py-4 { padding-top: 2rem; padding-bottom: 2rem; }
    .text-muted { color: var(--text-muted); }
    .text-error { color: var(--error-text); }

    .spinner-blue {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 3px solid rgba(37, 99, 235, 0.2);
      border-radius: 50%;
      border-top-color: var(--primary);
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 0.5rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Top navigation -->
  <nav class="top-nav">
    <a href="index.html" class="nav-link">← Back to Portal</a>
    <a href="courses.html" class="nav-link">View Available Courses →</a>
  </nav>

  <!-- Header -->
  <header class="header">
    <div class="header-title">
      <h1>Enrolled Students</h1>
      <p>View and search all registered course participants</p>
    </div>
    <div class="header-actions">
      <a href="registration.html" class="btn btn-primary">+ Register Student</a>
    </div>
  </header>

  <!-- Status Alert -->
  <div id="statusAlert" class="alert alert-error hidden" role="alert"></div>

  <!-- Filter & Search Controls -->
  <section class="controls-bar">
    <div class="filters-group">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="search" id="searchInput" placeholder="Search by student, email, or course...">
      </div>
      <select id="courseFilter" class="filter-select" aria-label="Filter by course">
        <option value="">All Courses</option>
      </select>
    </div>
    <div class="stats-and-actions">
      <div class="stats-badge">
        Total Enrolled: <strong id="enrollmentCount">0</strong>
      </div>
      <button id="refreshBtn" class="btn btn-outline" title="Refresh records">🔄 Refresh</button>
    </div>
  </section>

  <!-- Data Table -->
  <main class="table-container">
    <table>
      <thead>
        <tr>
          <th style="width: 90px;">ID</th>
          <th>Student Name</th>
          <th>Email Address</th>
          <th>Registered Course</th>
        </tr>
      </thead>
      <tbody id="enrolledTableBody">
        <tr>
          <td colspan="4" class="text-center py-4">
            <span class="spinner-blue"></span> Loading enrollment records...
          </td>
        </tr>
      </tbody>
    </table>
  </main>
</div>

<script src="enrolled.js"></script>
</body>
</html>
