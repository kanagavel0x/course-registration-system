<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Registration - Student Portal</title>
  <style>
    :root {
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
      --focus-ring: #93c5fd;
      --success-bg: #ecfdf5;
      --success-text: #065f46;
      --success-border: #a7f3d0;
      --error-bg: #fef2f2;
      --error-text: #991b1b;
      --error-border: #fecaca;
      --info-bg: #eff6ff;
      --info-text: #1e40af;
      --info-border: #bfdbfe;
      --radius: 10px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      padding: 2rem;
    }

    .header {
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 0.5rem;
    }

    .header p {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    /* Status Alert */
    .alert {
      padding: 0.85rem 1rem;
      border-radius: 6px;
      font-size: 0.9rem;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      line-height: 1.4;
      border: 1px solid transparent;
      animation: fadeIn 0.2s ease-in-out;
    }

    .alert-success {
      background-color: var(--success-bg);
      color: var(--success-text);
      border-color: var(--success-border);
    }

    .alert-error {
      background-color: var(--error-bg);
      color: var(--error-text);
      border-color: var(--error-border);
    }

    .alert-info {
      background-color: var(--info-bg);
      color: var(--info-text);
      border-color: var(--info-border);
    }

    .hidden {
      display: none !important;
    }

    /* Form Styles */
    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 0.4rem;
    }

    input[type="text"],
    input[type="email"],
    select {
      width: 100%;
      min-height: 48px;
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background-color: #fff;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input:focus,
    select:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    select {
      cursor: pointer;
      appearance: auto;
    }

    /* Course Details Card */
    .course-details {
      background: #f1f5f9;
      border-left: 4px solid var(--primary-color);
      border-radius: 6px;
      padding: 0.75rem 1rem;
      margin-bottom: 1.25rem;
      font-size: 0.85rem;
      animation: fadeIn 0.2s ease-in-out;
    }

    .course-details div {
      margin-bottom: 0.25rem;
    }

    .course-details div:last-child {
      margin-bottom: 0;
    }

    .course-details strong {
      color: var(--text-main);
    }

    /* Submit Button */
    button[type="submit"] {
      width: 100%;
      min-height: 48px;
      background-color: var(--primary-color);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.05s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    button[type="submit"]:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    button[type="submit"]:active:not(:disabled) {
      transform: scale(0.99);
    }

    button[type="submit"]:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      border-top-color: #ffffff;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Footer Links */
    .footer {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.875rem;
    }

    .footer a {
      color: var(--primary-color);
      text-decoration: none;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

<main class="container">
  <header class="header">
    <h1>Course Registration</h1>
    <p>Select your desired course and register your details</p>
  </header>

  <!-- Live Feedback Alert Container -->
  <div id="statusAlert" class="alert hidden" role="alert" aria-live="polite"></div>

  <!-- Registration Form -->
  <form id="registrationForm" action="/register" method="post">

    <div class="form-group">
      <label for="name">Full Name</label>
      <input
        type="text"
        id="name"
        name="name"
        placeholder="e.g. John Doe"
        required
        autocomplete="name"
      >
    </div>

    <div class="form-group">
      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="e.g. john@example.com"
        required
        autocomplete="email"
      >
    </div>

    <div class="form-group">
      <label for="courses">Available Courses</label>
      <select id="courses" name="courseName" required>
        <option value="">Loading courses...</option>
      </select>
    </div>

    <!-- Dynamic Course Preview Info -->
    <div id="courseDetails" class="course-details hidden">
      <div><strong>Course Code:</strong> <span id="detailCode">-</span></div>
      <div><strong>Instructor:</strong> <span id="detailTrainer">-</span></div>
      <div><strong>Duration:</strong> <span id="detailDuration">-</span></div>
    </div>

    <button type="submit" id="submitBtn">
      Register Course
    </button>

  </form>

  <footer class="footer">
    <a href="index.html">← Back to Portal Home</a>
  </footer>
</main>

<script src="courses.js"></script>
</body>
</html>
